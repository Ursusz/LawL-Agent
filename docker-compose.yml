services:
  backend:
    build: ./backend
    container_name: myapp-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the credentials file into the container
      # Make sure the path on the left is correct for your local machine
      - ./backend/src/utilities/credentials.json:/app/src/utilities/credentials.json:ro
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: myapp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped